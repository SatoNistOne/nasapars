name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pyinstaller

      - run: pyinstaller --onefile --windowed --name SpaceVault main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceVault-windows
          path: |
            dist/SpaceVault.exe
            style.qss